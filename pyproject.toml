[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wayland-computer-use-mcp"
version = "0.1.0"
description = "FastMCP server for interactive Wayland window/desktop streaming, semantic UI inspection, boundary-clamped input injection, and desktop integration."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "DeepMind & Antigravity Community" }
]
keywords = ["wayland", "mcp", "fastmcp", "pipewire", "libei", "at-spi", "desktop-use", "testing"]
dependencies = [
    "fastmcp>=2.0.0",
    "dbus-fast>=2.20.0",
    "pillow>=10.0.0",
    "pycairo>=1.26.0",
    "PyGObject>=3.48.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
wayland-computer-use-mcp = "wayland_computer_use_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wayland_computer_use_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["B008"]  # Allow FastMCP tool decorators and default arg patterns

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
